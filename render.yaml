databases:
  - name: fantasy-cricket-db
    plan: free

services:
  - type: web
    name: fantasy-cricket
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fantasy-cricket-db
          property: connectionString
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: SECRET_KEY
        generateValue: true
