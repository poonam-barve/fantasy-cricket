services:
  postgres:
    image: postgres:16-alpine
    container_name: fantasy-cricket-postgres
    environment:
      POSTGRES_DB: fantasy_cricket
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
    ports:
      - "5432:5432"
    volumes:
      - fantasy_cricket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy_cricket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fantasy_cricket_pgdata:
